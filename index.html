<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balancy">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Balancy</title>
<style>
:root{
  --bg:#ffffff;--card:#ffffff;--ink:#1d1d1f;--muted:#76767c;--line:#ececee;--soft:#f3f3f5;
  --inc:#dff3c3;--exp:#e7e8fc;--pill:#cdeca2;--pill-ink:#1d1d1f;
  --ok:#22d65a;--bad:#e5241b;--accent:#3f8f5a;--danger:#d93a2b;--danger-soft:#fde8e6;
  --nav:#111112;--nav-ink:#ffffff;--r:24px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f0f10;--card:#18181a;--ink:#f4f4f5;--muted:#9b9ba2;--line:#29292d;--soft:#232326;
  --inc:#2b3b1f;--exp:#26283f;--pill:#a9d873;--pill-ink:#111;--danger-soft:#3a1f1c;--nav:#000;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 20px 10px}
main{padding:0 16px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
/* header */
.top{display:flex;align-items:center;gap:12px}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:19px;color:#fff;
  background:#7b8cde;box-shadow:0 4px 14px rgba(0,0,0,.12);border:2px solid var(--card)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:60%;height:60%}
.hello{font-size:25px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpill{position:relative;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:22px;padding:7px 12px 7px 16px;font-size:16px;font-weight:600;flex:none}
.mpill svg{width:14px;height:14px}
.mpill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.mpill.past{border-color:var(--ink)}
.backbtn{width:40px;height:40px;border-radius:20px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
/* balance */
.balance{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 4px 14px}
.balance .lbl{font-size:18px}
.balance .lbl .hint{display:block}
.balance .amt{display:flex;align-items:center;gap:10px}
.big{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1}
.big small{font-size:22px;font-weight:600;letter-spacing:0}
.eye{width:34px;height:34px;display:grid;place-items:center;flex:none}
.eye svg{width:26px;height:26px}
.neg{color:var(--danger)}
.hint{color:var(--muted);font-size:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:30px;padding:18px 18px 20px;text-align:left;display:flex;flex-direction:column;min-height:180px}
.tile.inc{background:var(--inc)} .tile.exp{background:var(--exp)}
.tile .ring{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;margin-bottom:auto}
.tile .ring svg{width:20px;height:20px}
.tile .t1{font-size:17px;margin-top:22px}
.tile .t2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;white-space:nowrap}
.tile .t3{font-size:15px}
.tile .t3 b{font-size:17px}
.note{background:var(--soft);border-radius:16px;padding:11px 14px;font-size:14px;color:var(--muted);margin-top:12px}
/* section heads */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 4px 12px}
.sec h2{font-size:24px;margin:0;letter-spacing:-.01em}
.sec .count{color:var(--muted);font-size:15px}
.gname{display:flex;align-items:center;gap:8px;text-align:left;min-width:0}
.gname h2{font-size:21px;line-height:1.2}
.addpill.only{padding:6px}
.gname .pen{width:28px;height:28px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--muted)}
.gname .pen svg{width:15px;height:15px}
.gsum{color:var(--muted);font-size:14px;margin:-8px 4px 8px}
.addpill{display:flex;align-items:center;gap:8px;background:var(--pill);color:var(--pill-ink);border-radius:22px;padding:8px 8px 8px 16px;font-weight:700;font-size:15px;letter-spacing:.02em}
.addpill i{width:26px;height:26px;border-radius:13px;background:#1d1d1f;color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;line-height:1}
/* category cards */
.ccard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 12px;margin-bottom:10px;background:var(--card)}
.ccard.dim{opacity:.6}
.icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.icon svg{width:28px;height:28px}
.ccard .mid{flex:1;min-width:0}
.ccard .nm{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .sb{color:var(--muted);font-size:15px}
.ccard .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mini{width:66px;height:7px;border-radius:4px;background:var(--soft);overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.mini.bad i{background:var(--bad)}
.ccard .left{font-weight:700;font-size:16px;white-space:nowrap}
.setb{font-size:14px;font-weight:600;color:var(--accent)}
/* lists */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:6px 16px;margin:10px 0}
.card.pad{padding:16px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .icon{width:42px;height:42px;border-radius:13px}
.item .icon svg{width:22px;height:22px}
.item .mid{flex:1;min-width:0}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .amt{font-weight:700}
.sub{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.g{background:var(--inc);color:var(--ink)}
.strike{text-decoration:line-through;color:var(--muted)}
.dayhead{font-size:13px;color:var(--muted);padding:14px 0 0;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--ok)}
.btn{display:block;width:100%;padding:15px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:700;text-align:center;margin-top:12px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.banner{background:var(--danger-soft);color:var(--danger);padding:11px 14px;border-radius:14px;font-size:14px;margin:10px 0}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 8px;font-weight:700;display:flex;justify-content:space-between}
h3 span{text-transform:none;letter-spacing:0;font-weight:500}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--nav);color:var(--nav-ink);border-radius:26px 26px 0 0;
  display:flex;justify-content:space-around;align-items:center;padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:rgba(255,255,255,.75)}
nav.tabs button .ico{width:52px;height:32px;border-radius:16px;display:grid;place-items:center}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:#fff;font-weight:700}
nav.tabs button.on .ico{background:#fff;color:#111}
nav.tabs .add{flex:none;width:56px;height:56px;border-radius:28px;background:var(--pill);color:#111;margin:-30px 4px 0;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);border:4px solid var(--bg)}
nav.tabs .add svg{width:26px;height:26px}
/* sheet */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;
  transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;padding:0 18px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
#sheet.on{transform:none;visibility:visible;transition:transform .25s ease}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px;z-index:1}
.sheet-h b{font-size:18px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.sheet-h button{font-size:17px;min-width:72px;text-align:left;color:var(--muted)}
.sheet-h button:last-child{text-align:right;font-weight:700;color:var(--ink)}
.amtwrap{text-align:center;padding:8px 0 2px}
input.amtin{width:100%;text-align:center;font-size:46px;font-weight:800;border:0;background:none;outline:none;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:20px;background:var(--soft);font-size:15px;border:2px solid transparent}
.chip .icon{width:26px;height:26px;border-radius:9px}
.chip .icon svg{width:16px;height:16px}
.chip.on{border-color:var(--ink);background:var(--card)}
.group{border:1.5px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0;background:var(--card)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.group .field:last-child{border-bottom:0}
.field label{flex:none}
.field input,.field select{border:0;background:none;text-align:right;outline:none;min-width:0;flex:1;width:100%}
.field input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:#1d1d1f}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px;margin:10px 0}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:var(--danger);font-size:14px;min-height:20px;text-align:center}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.icongrid button{aspect-ratio:1;border-radius:14px;background:var(--soft);display:grid;place-items:center;border:2px solid transparent}
.icongrid button svg{width:24px;height:24px}
.icongrid button.on{border-color:var(--ink);background:var(--card)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.profile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
.profile .avatar{width:96px;height:96px;font-size:36px}
.linkbtn{color:var(--accent);font-weight:600;font-size:15px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:12px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.chart .stack{width:100%;max-width:36px;display:flex;flex-direction:column-reverse;border-radius:10px 10px 4px 4px;overflow:hidden;background:var(--soft)}
.chart .stack i{display:block}
.chart .inc{position:absolute;left:8%;right:8%;border-top:2px dashed var(--muted)}
.chart .lab{font-size:12px;color:var(--muted);margin-top:6px}
.chart .col.sel .lab{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{height:7px;border-radius:4px;background:var(--soft);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.menu .btn{margin-top:8px}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div id="backdrop" data-act="close"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>

'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const todayISO = () => { const d = new Date(); return ym(d) + '-' + pad(d.getDate()); };
const thisMonth = () => ym(new Date());
const r2 = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function addM(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return y + '-' + pad(mo); }
function dim(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
const toDate = iso => { const [y, mo, d] = iso.split('-').map(Number); return new Date(y, mo - 1, d || 1); };
function mLabel(m, style = 'long') {
  const d = toDate(m);
  if (style === 'short') return d.toLocaleDateString(LOCALE, { month: 'short' });
  if (style === 'name') return d.toLocaleDateString(LOCALE, { month: 'long' });
  return d.toLocaleDateString(LOCALE, { month: style, year: 'numeric' });
}
const dLabel = iso => toDate(iso).toLocaleDateString(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' });
const dLong = iso => toDate(iso).toLocaleDateString(LOCALE, { day: 'numeric', month: 'long', year: 'numeric' });
function parseAmt(v) {
  v = String(v ?? '').trim().replace(/[\s'€$£]/g, '');
  if (!v) return NaN;
  if (v.includes(',') && v.includes('.')) v = v.lastIndexOf(',') > v.lastIndexOf('.') ? v.replace(/\./g, '').replace(',', '.') : v.replace(/,/g, '');
  else v = v.replace(',', '.');
  const n = parseFloat(v); return isFinite(n) ? r2(n) : NaN;
}
const numIn = n => n ? String(n).replace('.', LANG === 'de' ? ',' : '.') : '';

/* ================= language ================= */
const I18N = {

  calculated: 'Calculated', paymentsMade: 'Payments made', stillToPay: 'Still to pay (incl. interest)', interestPaid: 'Interest paid so far', totalInterest: 'Total interest',

  interestLeft: 'Interest still to pay', loanWarn: x => `With these numbers about ${x} would still be owed at the end date. Check the remaining sum, payment or interest rate.`,

  avgByCat: 'Average per month, by category', noSpending: 'No spending in this period.',
  settings: 'Settings', profile: 'Profile', yourName: 'Your name', namePh: 'Name', changePhoto: 'Choose photo', removePhoto: 'Remove photo',
  general: 'General', language: 'Language', langAuto: 'Automatic (iPhone)', currency: 'Currency', money: 'Money', monthlyIncome: 'Monthly income',

/* ================= money logic ================= */
let loanCache = {}, carryCache = {}, entryCache = {};
function clearCaches() { loanCache = {}; carryCache = {}; entryCache = {}; }
const catById = id => S.categories.find(c => c.id === id) || { id: '', name: t('uncategorised'), color: '#8f887d', icon: 'dots', budget: 0 };
const catByKey = k => S.categories.find(c => c.key === k);
function amountAt(r, m) { let a = r.amounts[0].amount; for (const x of r.amounts) if (x.from <= m) a = x.amount; return a; }
const monthOf = d => d ? d.slice(0, 7) : null;
// Loans: payments are counted from r.start. The balance is known from r.balanceFrom (before that month's payment).
// With an interest rate each payment covers that month's interest first. With an end date payments run until then.
const ceil2 = n => Math.ceil(n * 100 - 1e-6) / 100;
function annuity(P, ratePa, n, F = 0) {
  const i = (ratePa || 0) / 1200; if (!(P > 0) || !(n > 0)) return 0;
  if (F > 0) { // n-1 equal payments plus a different final payment F
    if (n === 1) return F;
    const rest = P - F * Math.pow(1 + i, -n); if (rest <= 0) return 0;
    return ceil2(i ? rest * i / (1 - Math.pow(1 + i, -(n - 1))) : rest / (n - 1));

// New-style plans (r.term): financed amount = price + shipping, interest charged monthly on what is still open,
// payments run from r.start until everything incl. interest is paid. Skipped months add interest and push the end back.
function planSched(r) {
  const s = {}, rate = (r.rate || 0) / 1200;
  let rem = r2((r.principal || 0) + (r.shipping || 0)), m = r.start, end = null, n = 0;
  for (let i = 0; i < 720 && rem > 0.004; i++) {
    const skipped = (r.skips || []).includes(m), interest = r2(rem * rate);
    let pay = 0;
    if (!skipped) { // the last payment of the term settles any rounding difference
      n++;
      const last = r.term && n >= r.term;
      if (last && r.lastPay > 0) pay = r.lastPay;                       // contract's final payment closes the plan
      else if (last && !r.payment) pay = r2(rem + interest);            // settle rounding differences
      else pay = Math.min(amountAt(r, m), r2(rem + interest));
      if (last && r.lastPay > 0) { s[m] = { pay, rem: 0, interest: r2(pay - rem) }; end = m; rem = 0; break; }
    }
    rem = Math.max(0, r2(rem + interest - pay));
    s[m] = { pay, rem, interest }; end = m; m = addM(m, 1);

}
function loanStats(r) {

  for (const k in L.s) {

    else { o.toPay += e.pay; o.intLeft += e.interest || 0; if (e.pay > 0) o.cntLeft++; }
  }

function loanSched(r) {

  const s = {}, endM = monthOf(r.loanEnd), from = r.balanceFrom || r.start, rate = (r.rate || 0) / 1200;
  let rem = r2(r.balance || 0), m = r.start, end = null;

    let pay = 0;
    if (m < from) { if (!skipped) pay = amountAt(r, m); s[m] = { pay, rem: null }; }
    else {

      rem = Math.max(0, r2(rem + interest - pay));

function viewTrends() {
  const end = UI.month, months = [];
  for (let i = 5; i >= 0; i--) months.push(addM(end, -i));
  const data = months.map(m => ({ m, ...totals(m) }));
  const max = Math.max(1, ...data.map(d => Math.max(d.spent, d.income)));
  const cols = data.map(d => `<div class="col ${d.m === end ? 'sel' : ''}">
      ${d.income ? `<div class="inc" style="bottom:calc(${d.income / max} * (100% - 22px) + 22px)"></div>` : ''}
      <div class="stack" style="height:calc(${d.spent / max} * (100% - 22px))">
        <i style="height:${d.spent ? d.rec / d.spent * 100 : 0}%;background:#b9bcf3"></i>
        <i style="height:${d.spent ? d.exp / d.spent * 100 : 0}%;background:#8fd16a"></i></div>
      <div class="lab">${esc(mLabel(d.m, 'short'))}</div></div>`).join('');
  const f0 = firstMonth();
  const rows = data.filter(d => d.m >= f0 || d.spent).reverse().map(d => `<div class="row"><span><div>${esc(mLabel(d.m))}</div>
      <div class="sub num">${esc(t('spentOf', money(d.spent), money(d.income)))}</div></span>
      <span class="num" style="text-align:right"><b class="${d.left < 0 ? 'neg' : ''}">${money(d.left)}</b><div class="sub">${t('left')}</div></span></div>`).join('');
  const sums = {};
  for (const m of months) { const s = catSpend(m); for (const id in s) sums[id] = (sums[id] || 0) + s[id]; }
  const avg = Object.entries(sums).map(([id, v]) => ({ c: catById(id), v: v / months.length })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const amax = Math.max(1, ...avg.map(x => x.v));
  const avgHTML = avg.map(x => `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px">
      <span style="display:flex;align-items:center;gap:10px"><span class="icon" style="${tint(x.c.color)};width:32px;height:32px;border-radius:10px">${svg(x.c.icon)}</span>${esc(x.c.name)}</span>
      <span class="num">${money(x.v)}<span class="sub"> ${t('perMonth')}</span></span></div><div class="bar"><i style="width:${x.v / amax * 100}%;background:${esc(x.c.color)}"></i></div></div>`).join('');
  const body = `<div class="card pad"><div class="hint">${esc(t('spendingRange', mLabel(months[0]), mLabel(end)))}</div>
      <div class="chart">${cols}</div>
      <div class="legend"><span><i style="background:#8fd16a"></i>${t('legendExp')}</span><span><i style="background:#b9bcf3"></i>${t('legendRec')}</span><span><i style="border-top:2px dashed var(--muted);height:0;border-radius:0"></i>${t('legendInc')}</span></div></div>
    <h3>${t('monthByMonth')}</h3><div class="card">${rows || `<div class="empty">${t('nothingTracked')}</div>`}</div>
    <h3>${t('avgByCat')}</h3><div class="card">${avgHTML || `<div class="empty">${t('noSpending')}</div>`}</div>`;
  return { header: header(t('trendsTitle')), body };
}

      <div class="group"><div class="field"><input id="r-pause" type="month" value="${lp.first > m ? lp.first : m}" style="text-align:left"><button class="addpill" data-act="addPause" style="flex:none">${t('addPause')} <i>+</i></button></div></div>
      <div class="chips" id="pause-list"></div>
      <div class="hint" style="padding:0 6px">${t('pauseHint')}</div>
    </div>
    ${r && r.kind !== 'loan' ? `<div class="hint" data-only="fixed" style="padding:8px 6px 0">${t('amountChangeHint')}</div>` : ''}    ${r ? `<div class="hint" style="padding:8px 6px 0">${t('amountChangeHint')}</div>` : ''}
    <h3>${t('group')}</h3><div class="chips">${S.recGroups.map(x => `<button class="chip ${x.id === sheetState.group ? 'on' : ''}" data-act="pickGroup" data-id="${x.id}" style="padding-left:12px">${esc(x.name)}</button>`).join('')}</div>
    <h3>${t('categoryLbl')}</h3>${chipsHTML(sheetState.cat, 'pickRecCat')}
    ${r ? `<button class="btn danger" data-act="delRec">${r.kind === 'loan' ? t('deleteLoan') : t('deleteRec')}</button>` : ''}`);
  syncRecType(); renderPauses();
}
function renderPauses() {
  const el = $('#pause-list'); if (!el) return;
  const list = (sheetState.skips || []).slice().sort();
  el.innerHTML = list.length ? list.map(x => `<button class="chip" data-act="rmPause" data-v="${x}" style="padding-left:12px">${esc(mLabel(x))} <span style="font-size:18px;line-height:1">×</span></button>`).join('')
    : `<span class="hint" style="padding:0 6px">${t('noPauses')}</span>`;
}
function syncRecType() {
  document.querySelectorAll('#sheet [data-only]').forEach(el => el.style.display = el.dataset.only === sheetState.type ? '' : 'none');
  document.querySelectorAll('#sheet [data-act=recType]').forEach(b => b.classList.toggle('on', b.dataset.v === sheetState.type));
  if (sheetState.kind === 'rec') updateLoanPreview();
}
function saveRec() {
  const err = x => { $('#f-err').textContent = x; $('#sheet').scrollTop = 0; };
  const kind = sheetState.type, name = $('#r-name').value.trim();
  const day = Math.min(31, Math.max(1, parseInt($('#r-day').value, 10) || 1));
  const old = sheetState.id ? S.recurring.find(x => x.id === sheetState.id) : null;
  const base = { name, kind, day, categoryId: sheetState.cat, groupId: sheetState.group };
  if (!name) return err(t('errName'));
  if (kind === 'fixed') {
    const amt = parseAmt($('#r-amt').value), start = $('#r-start').value, end = $('#r-end').value || null;
    if (!(amt > 0)) return err(t('errMonthly'));
    if (!/^\d{4}-\d\d$/.test(start)) return err(t('errFirst'));
    if (end && end < start) return err(t('errLastBefore'));
    if (old) {
      const wasLoan = old.kind === 'loan', from = wasLoan ? start : (($('#r-from') && $('#r-from').value) || start);
      Object.assign(old, base, { start, end, term: 0, principal: 0, shipping: 0, rate: 0, payment: 0, balance: null, balanceFrom: null, loanStart: null, loanEnd: null });
      if (wasLoan) old.amounts = [{ from: start, amount: amt }];
      else if (amountAt(old, from) !== amt) {
        old.amounts = old.amounts.filter(x => x.from < from);
        old.amounts.push({ from: old.amounts.length ? from : start, amount: amt });
        old.amounts.sort((a, b) => a.from.localeCompare(b.from));
      }
    } else S.recurring.push({ id: uid(), ...base, start, end, amounts: [{ from: start, amount: amt }], skips: [] });
  } else {
    const f = planFromForm();
    if (!(f.principal > 0)) return err(t('errPrice'));
    if (f.ship < 0) return err(t('errShip'));
    if (!(f.term >= 1 && f.term <= 600)) return err(t('errTerm'));
    if (!/^\d{4}-\d\d$/.test(f.first)) return err(t('errFirstPay'));
    if (f.rate < 0 || f.rate > 50) return err(t('errRate'));
    const fields = { start: f.first, end: null, principal: f.principal, shipping: f.ship > 0 ? f.ship : 0, rate: f.rate > 0 ? f.rate : 0, term: f.term,
      payment: f.override > 0 ? f.override : 0, lastPay: f.last > 0 ? f.last : 0, skips: (sheetState.skips || []).slice().sort(), loanNumber: $('#r-no').value.trim(), balance: null, balanceFrom: null, loanStart: null, loanEnd: null,
      amounts: [{ from: f.first, amount: f.pay }] };
    if (!planSched(fields).end) return err(t('errTooLow'));
    if (old) Object.assign(old, base, fields);
    else S.recurring.push({ id: uid(), ...base, ...fields });
  }
  save(); closeSheet(); render();
}
function groupSheet(id) {
  const g = id ? S.recGroups.find(x => x.id === id) : null;
  sheetState = { kind: 'group', id: g ? g.id : null, type: g ? g.kind : 'fixed' };
  openSheet(`${sheetHead(g ? g.name : t('newGroup'), t('save'), 'saveGroup')}
    <div class="err" id="f-err"></div>
    <div class="group"><div class="field"><label>${t('groupName')}</label><input id="g-name" value="${esc(g ? g.name : '')}" placeholder="${t('groupNamePh')}"></div></div>
    <h3>${t('defaultType')}</h3>
    <div class="seg"><button data-act="recType" data-v="fixed">${t('fixedCost')}</button><button data-act="recType" data-v="loan">${t('loanCredit')}</button></div>
    <div class="hint" style="padding:0 6px">${t('groupHint')}</div>
    ${g ? `<button class="btn danger" data-act="delGroup" data-id="${g.id}">${t('deleteGroup')}</button>` : ''}`);
  syncRecType();
  if (!g) $('#g-name').focus();
}
function saveGroup() {
  const name = $('#g-name').value.trim();
  if (!name) { $('#f-err').textContent = t('errGroupName'); return; }
  if (sheetState.id) Object.assign(S.recGroups.find(x => x.id === sheetState.id), { name, kind: sheetState.type });
  else S.recGroups.push({ id: uid(), name, kind: sheetState.type });
  save(); closeSheet(); render();
}
function incomeSheet() {
  const m = UI.month, has = m in S.incomeOverrides;
  sheetState = { kind: 'income' };
  openSheet(`${sheetHead(t('incomeFor', mLabel(m, 'name')), t('save'), 'saveIncome')}
    <div class="amtwrap"><input id="f-inc" class="amtin num" inputmode="decimal" placeholder="${t('amountPh')}" value="${numIn(incomeFor(m))}"></div>
    <div class="hint" style="text-align:center">${esc(t('incomeHint', money(S.settings.income || 0)))}</div>
    ${has ? `<button class="btn ghost" data-act="clearIncome">${t('useUsual')}</button>` : ''}`);
  $('#f-inc').focus();
}

/* ================= import / export / photo ================= */
async function shareOrDownload(text, name, type) {
  const blob = new Blob([text], { type });
  try { const file = new File([blob], name, { type }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; } }
  catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
async function exportJSON() {
  if (await shareOrDownload(JSON.stringify(S, null, 2), `balancy-backup-${todayISO()}.json`, 'application/json')) { S.settings.lastBackup = Date.now(); save(); render(); }
}
function exportCSV() {
  const de = LANG === 'de', sep = de ? ';' : ',', q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const lines = [t('csvHead').join(sep)];
  const last = [thisMonth(), ...S.expenses.map(e => e.date.slice(0, 7))].sort().pop();
  for (let m = firstMonth(); m <= last; m = addM(m, 1))
    for (const e of monthEntries(m).slice().reverse()) {
      if (e.type === 'rec' && e.skipped) continue;
      const amt = de ? e.amount.toFixed(2).replace('.', ',') : e.amount.toFixed(2);
      lines.push([e.date, q(catById(e.categoryId).name), q(e.note || ''), amt, e.type === 'rec' ? (e.kind === 'loan' ? t('csvLoan') : t('csvRec')) : t('csvExp')].join(sep));
    }
  shareOrDownload('﻿' + lines.join('\n'), `balancy-${todayISO()}.csv`, 'text/csv');
}
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.version !== 1 || !Array.isArray(d.expenses) || !Array.isArray(d.recurring) || !Array.isArray(d.categories)) throw new Error('bad');
    if (!confirm(t('cRestore', d.expenses.length, d.recurring.length))) return;
    S = migrate(d); applyLang(); save(); UI.month = thisMonth(); render();
  } catch (e) { alert(t('notBackup')); }
});
$('#photoFile').addEventListener('change', ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const size = 320, cv = document.createElement('canvas'); cv.width = cv.height = size;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    S.profile.photo = cv.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(url); save(); render();
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert(t('photoFail')); };
  img.src = url;
});
function setLang(v) {
  const before = LANG; S.settings.lang = v; applyLang();
  if (before !== LANG) for (const c of S.categories) { // rename built-in categories the user hasn't renamed
    const def = DEFAULT_CATS.find(x => x.key === c.key);
    if (def && (c.name === def.en || c.name === def.de)) c.name = def[LANG];
  }
  if (before !== LANG) for (const g of S.recGroups) {
    const def = DEFAULT_GROUPS.find(x => x.key === g.key);
    if (def && (g.name === def.en || g.name === def.de)) g.name = def[LANG];
  }
}

/* ================= events ================= */
document.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { UI.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'close': closeSheet(); break;
    case 'openSettings': UI.back = UI.tab; UI.tab = 'settings'; render(); window.scrollTo(0, 0); break;
    case 'back': UI.tab = UI.back || 'budget'; render(); window.scrollTo(0, 0); break;
    case 'goTx': UI.tab = 'tx'; render(); window.scrollTo(0, 0); break;
    case 'toggleHide': S.settings.hide = !S.settings.hide; save(); render(); break;
    case 'newExp': expenseSheet(null); break;
    case 'editExp': expenseSheet(id); break;
    case 'pickCat': case 'pickRecCat': sheetState.cat = id; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); break;
    case 'saveExp': saveExpense(); break;
    case 'delExp': if (confirm(t('cDelExpense'))) { S.expenses = S.expenses.filter(x => x.id !== sheetState.id); save(); closeSheet(); render(); } break;
    case 'newCat': catSheet(null); break;
    case 'editCat': catSheet(id); break;
    case 'pickIcon': sheetState.icon = el.dataset.v; document.querySelectorAll('#c-icons button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'pickColor': sheetState.color = el.dataset.v;
      document.querySelectorAll('.swatches button').forEach(b => b.classList.toggle('on', b === el));
      document.querySelectorAll('#c-icons button').forEach(b => b.style.color = sheetState.color); break;
    case 'saveCat': saveCat(); break;
    case 'delCat': {
      const c = catById(id), used = S.expenses.some(e => e.categoryId === id) || S.recurring.some(r => r.categoryId === id);
      if (S.categories.length <= 1) { alert(t('cOneCat')); break; }
      if (!confirm(used ? t('cDelCatUsed', c.name) : t('cDelCat', c.name))) break;
      S.categories = S.categories.filter(x => x.id !== id);
      if (used) {
        const fb = catByKey('other') || S.categories[S.categories.length - 1];
        S.expenses.forEach(e => { if (e.categoryId === id) e.categoryId = fb.id; });
        S.recurring.forEach(r => { if (r.categoryId === id) r.categoryId = fb.id; });
      }
      save(); closeSheet(); render(); break; }
    case 'recMenu': recMenu(id); break;
    case 'loanInfo': loanInfo(id); break;
    case 'toggleSkip': {
      const r = S.recurring.find(x => x.id === sheetState.id); r.skips = r.skips || [];
      r.skips = r.skips.includes(UI.month) ? r.skips.filter(x => x !== UI.month) : r.skips.concat(UI.month);
      save(); closeSheet(); render(); break; }
    case 'newRec': recSheet(null, el.dataset.group); break;
    case 'newGroup': groupSheet(null); break;
    case 'addPause': { const v = $('#r-pause').value; if (/^\d{4}-\d\d$/.test(v) && !sheetState.skips.includes(v)) sheetState.skips.push(v); renderPauses(); updateLoanPreview(); break; }
    case 'rmPause': sheetState.skips = sheetState.skips.filter(x => x !== el.dataset.v); renderPauses(); updateLoanPreview(); break;
    case 'editGroup': groupSheet(id); break;
    case 'saveGroup': saveGroup(); break;
    case 'pickGroup': {
      sheetState.group = id; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el));
      if (!sheetState.id) { const g = S.recGroups.find(x => x.id === id); sheetState.type = g.kind; syncRecType();
        const c = groupDefaultCat(g, g.kind); sheetState.cat = c; document.querySelectorAll('#sheet [data-act=pickRecCat]').forEach(ch => ch.classList.toggle('on', ch.dataset.id === c)); }
      break; }
    case 'delGroup': {
      if (S.recGroups.length <= 1) { alert(t('cOneGroup')); break; }
      const g = S.recGroups.find(x => x.id === id), rest = S.recGroups.filter(x => x.id !== id), items = S.recurring.filter(r => r.groupId === id);
      const to = rest.find(x => x.key === 'fixed') || rest[0];
      if (!confirm(items.length ? t('cDelGroupMove', g.name, items.length, to.name) : t('cDelGroup', g.name))) break;
      items.forEach(r => r.groupId = to.id); S.recGroups = rest; save(); closeSheet(); render(); break; }
    case 'editRec': recSheet(id); break;
    case 'recType': {
      sheetState.type = el.dataset.v; syncRecType();
      if (sheetState.kind === 'rec' && !sheetState.id) { const c = catByKey(sheetState.type === 'loan' ? 'loans' : 'housing');
        if (c) { sheetState.cat = c.id; document.querySelectorAll('#sheet [data-act=pickRecCat]').forEach(ch => ch.classList.toggle('on', ch.dataset.id === c.id)); } }
      break; }
    case 'saveRec': saveRec(); break;
    case 'delRec': if (confirm(t('cDelRec'))) { S.recurring = S.recurring.filter(x => x.id !== sheetState.id); save(); closeSheet(); render(); } break;
    case 'editIncome': incomeSheet(); break;
    case 'saveIncome': { const v = parseAmt($('#f-inc').value); S.incomeOverrides[UI.month] = v >= 0 ? v : 0; save(); closeSheet(); render(); break; }
    case 'clearIncome': delete S.incomeOverrides[UI.month]; save(); closeSheet(); render(); break;
    case 'pickPhoto': $('#photoFile').click(); break;
    case 'removePhoto': S.profile.photo = null; save(); render(); break;
    case 'exportJSON': exportJSON(); break;
    case 'importJSON': $('#importFile').click(); break;
    case 'exportCSV': exportCSV(); break;
    case 'reset': if (confirm(t('cReset'))) { const lang = S.settings.lang; S = fresh(); S.settings.lang = lang; save(); UI.month = thisMonth(); UI.tab = 'budget'; render(); } break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset.set; if (!k) return;
  if (k === 'rollover') S.settings.rollover = el.checked;
  else if (k === 'income' || k === 'opening') { const v = parseAmt(el.value); S.settings[k] = isNaN(v) ? 0 : v; }
  else if (k === 'startMonth') { if (/^\d{4}-\d\d$/.test(el.value)) S.settings.startMonth = el.value; }
  else if (k === 'name') S.profile.name = el.value.trim();
  else if (k === 'lang') setLang(el.value);
  else S.settings[k] = el.value;
  save(); render();
});
document.addEventListener('input', ev => { if (sheetState.kind === 'rec' && /^r-(principal|ship|rate|term|first|pay|last)$/.test(ev.target.id)) updateLoanPreview(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && $('#sheet').classList.contains('on') && ev.target.tagName === 'INPUT') {
    ev.preventDefault();
    ({ exp: saveExpense, rec: saveRec, cat: saveCat, group: saveGroup, income: () => $('#sheet [data-act=saveIncome]').click() }[sheetState.kind] || (() => {}))();
  }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.set) ev.target.blur();
  if (ev.key === 'Escape') closeSheet();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#sheet').classList.contains('on')) render(); });

/* ================= boot ================= */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
try { if (!localStorage.getItem(KEY)) save(); } catch (e) {}
render();
</script>
